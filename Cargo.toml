[workspace]
members = [".", "crates/orbolay-core", "crates/orbolay-keys", "crates/orbolay-transport", "crates/orbolay-ui", "crates/orbolay-control"]
resolver = "3"

[workspace.dependencies]
chrono = "0.4.41"
dirs = "6.0.0"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
flume = "0.12"
freya = { git = "https://github.com/marc2332/freya.git", branch = "main", features = ["engine", "html"] }

gumdrop = "0.8.1"
interprocess = "2.4.2"
log = "0.4"
notify = "8.2.0"
open = "5.3.5"
rdev = { version = "0.5", features = ["unstable_grab", "serialize"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
tungstenite = { version = "0.29", features = ["url"] }
url = "2.5.8"
winit = { version = "0.30", features = ["wayland", "x11", "rwh_06"] }
x11rb = { version = "0.13", features = ["as-raw-xcb-connection", "shape"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
use_self = "warn"
redundant_clone = "warn"
or_fun_call = "warn"
significant_drop_in_scrutinee = "warn"
significant_drop_tightening = "warn"
needless_collect = "warn"
equatable_if_let = "warn"
derive_partial_eq_without_eq = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

[package]
name = "orbolay"
version = "4.3.0"
edition = "2024"
rust-version = "1.95"
description = "Quick, small, native Discord overlay for modded Linux clients"

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
chrono = { workspace = true }
flume = { workspace = true }
freya = { workspace = true }
gumdrop = { workspace = true }
orbolay-core = { path = "crates/orbolay-core" }
orbolay-keys = { path = "crates/orbolay-keys" }
log = { workspace = true }
orbolay-transport = { path = "crates/orbolay-transport" }
orbolay-ui = { path = "crates/orbolay-ui" }
orbolay-control = { path = "crates/orbolay-control" }
serde_json = { workspace = true }
rdev = { workspace = true }
winit = { workspace = true }
x11rb = { workspace = true }
env_logger = { workspace = true }
